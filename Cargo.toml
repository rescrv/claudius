[package]
name = "claudius"
version = "0.33.0"
authors = ["Robert Escriva <robert@rescrv.net>"]
edition = "2024"
description = "SDK for the Anthropic API"
license = "Apache-2.0"
repository = "https://github.com/rescrv/claudius"

[features]
default = ["binaries", "reqwest-backend", "native-tls"]

binaries = []

# HTTP backend selection.
#
# By default claudius uses reqwest as its HTTP backend. Enabling the
# `hyper-boring` feature switches the backend to hyper with BoringSSL (via
# hyper-boring); combine it with `--no-default-features` to avoid compiling
# reqwest entirely.
reqwest-backend = ["dep:reqwest"]
hyper-boring = [
    "dep:boring",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-boring",
    "dep:hyper-util",
]

# TLS backend selection for the reqwest backend.
rustls-tls = ["reqwest-backend", "reqwest/rustls"]
native-tls = ["reqwest-backend", "reqwest/native-tls"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.11.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
futures = "0.3.32"
getopts = "0.2.24"
# Request and response types shared by both HTTP backends.
http = "1.5.0"
libc = "0.2.186"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "query",
    "stream",
], optional = true }
rustyline = "18.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_yaml = "0.9.34"
time = { version = "0.3.47", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
url = "2.5.8"

arrrg = "0.10.0"
arrrg_derive = "0.10.0"
biometrics = "0.14.0"
utf8path = "0.11.0"

# The hyper + BoringSSL HTTP backend (enable the `hyper-boring` feature).
boring = { version = "5.2.0", optional = true }
hyper = { version = "1.11.1", optional = true }
hyper-boring = { version = "5.2.0", optional = true }
hyper-util = { version = "0.1.20", features = [
    "client",
    "client-legacy",
    "http1",
    "tokio",
], optional = true }
http-body-util = { version = "0.1.5", optional = true }

[[bin]]
name = "median-text"
path = "src/bin/median-text.rs"
required-features=["binaries"]

[[bin]]
name = "claudius-prompt"
path = "src/bin/claudius-prompt.rs"
required-features=["binaries"]

[[bin]]
name = "claudius-chat"
path = "src/bin/claudius-chat.rs"
required-features=["binaries"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full", "test-util", "macros"] }
tokio-test = "0.4.5"

[[example]]
name = "retry_example"
path = "examples/retry_example.rs"
